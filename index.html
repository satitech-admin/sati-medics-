<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#087a52" />
  <meta name="description" content="Sati Medics — medicines, doctor consultations and healthcare services." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Sati Medics</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Sati Medics home">
        <span class="brand-mark">✚</span>
        <span><strong>Sati Medics</strong><small>Your Health, Our Priority</small></span>
      </button>
      <div class="location-pill">
        <span>📍</span>
        <select id="citySelect" aria-label="Select city">
          <option>Betul</option><option>Bhopal</option><option>Indore</option><option>Nagpur</option>
          <option>Itarsi</option><option>Harda</option><option>Narmadapuram</option>
        </select>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notificationBtn" aria-label="Notifications">🔔</button>
        <button class="icon-btn cart-button" data-nav="cart" aria-label="Cart">🛒<span id="cartCount">0</span></button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-item active" data-nav="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-nav="medicines"><span>💊</span><small>Medicines</small></button>
      <button class="nav-item" data-nav="consult"><span>🩺</span><small>Consult</small></button>
      <button class="nav-item" data-nav="orders"><span>📦</span><small>Orders</small></button>
      <button class="nav-item" data-nav="profile"><span>👤</span><small>Profile</small></button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <template id="homeTemplate">
    <section class="page home-page">
      <div class="hero">
        <div class="hero-copy">
          <span class="eyebrow">HEALTHCARE AT YOUR DOORSTEP</span>
          <h1>Medicines, expert doctors & care — all in one app.</h1>
          <p>Same-day local medicine delivery, verified consultation and smarter family healthcare.</p>
          <div class="hero-actions">
            <button class="primary-btn" data-nav="medicines">Order medicines</button>
            <button class="secondary-btn" data-nav="consult">Consult a doctor</button>
          </div>
          <div class="trust-row"><span>✓ Licensed pharmacy network</span><span>✓ Secure prescriptions</span><span>✓ Local delivery</span></div>
        </div>
        <div class="doctor-card">
          <div class="doctor-visual">🧑‍⚕️</div>
          <div><strong>24/7 Care Access</strong><small>General physician • Specialists • Follow-ups</small></div>
        </div>
      </div>

      <div class="search-wrap">
        <input id="globalSearch" type="search" placeholder="Search medicines, symptoms, doctors or tests..." />
        <button class="search-btn" id="globalSearchBtn">Search</button>
      </div>

      <div class="quick-grid">
        <button class="quick-card mint" data-nav="medicines"><span>💊</span><strong>Medicines</strong><small>Same-day delivery</small></button>
        <button class="quick-card blue" data-nav="consult"><span>🩺</span><strong>Doctor Consult</strong><small>Chat, audio & video</small></button>
        <button class="quick-card lilac" data-nav="labs"><span>🧪</span><strong>Lab Tests</strong><small>Home sample collection</small></button>
        <button class="quick-card peach" data-nav="prescription"><span>📄</span><strong>Prescription</strong><small>Upload & order</small></button>
      </div>

      <section class="section-block">
        <div class="section-title"><div><span class="eyebrow">CONSULT BY SPECIALTY</span><h2>Care for every health need</h2></div><button data-nav="consult">View all</button></div>
        <div class="specialty-row">
          <button data-specialty="General Physician">🩺<span>General</span></button>
          <button data-specialty="Pediatrician">👶<span>Child Care</span></button>
          <button data-specialty="Gynecologist">🌸<span>Women</span></button>
          <button data-specialty="Dermatologist">✨<span>Skin</span></button>
          <button data-specialty="Orthopedic">🦴<span>Ortho</span></button>
          <button data-specialty="Mental Wellness">🧠<span>Wellness</span></button>
        </div>
      </section>

      <section class="promo-grid">
        <article class="promo medicine-promo"><span>FAST DELIVERY</span><h3>Need medicines today?</h3><p>Order from verified local pharmacy partners in your service area.</p><button data-nav="medicines">Shop medicines →</button></article>
        <article class="promo consult-promo"><span>DOCTOR ONLINE</span><h3>Not sure whom to consult?</h3><p>Choose a specialty or start with a general physician.</p><button data-nav="consult">Find doctor →</button></article>
      </section>

      <section class="section-block">
        <div class="section-title"><div><span class="eyebrow">HEALTH PROGRAMS</span><h2>Designed around real families</h2></div></div>
        <div class="program-grid">
          <article><span>❤️</span><div><strong>Diabetes Care</strong><small>Medicines, tests, diet & consultation</small></div></article>
          <article><span>🫀</span><div><strong>Heart Health</strong><small>BP care, refills & specialist support</small></div></article>
          <article><span>👵</span><div><strong>Senior Care</strong><small>Family profiles and recurring refills</small></div></article>
        </div>
      </section>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
